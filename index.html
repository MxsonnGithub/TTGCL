<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta property="og:title" content="TTG Challenge list" />
        <meta property="og:description" content="A list of community made levels." />
        <meta property="og:image" content="/assets/laylist.png" />
        <title>The TTG Challenge List</title>
        <link rel="icon" href="/assets/laylist.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/packs.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/grind.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
        <script src="https://unpkg.com/vue-router@4.5.0/dist/vue-router.global.prod.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pako@2.0.4/dist/pako.min.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <router-link class="nav__tab" to="/packs">
                    <span class="type-label-lg">Packs</span>
                </router-link>
                <router-link class="nav__tab" to="/grind">
                    <span class="type-label-lg">Grind</span>
                </router-link>
            </nav>
            <div class="logo">
                <h2>TTG Challenge list</h2>
            </div>
            <div class="nav__actions" v-if="store.list && store.loaded">
                <div class="color-picker-wrapper nav__icon">
                    <img :src="store.dark ? '/assets/palette-dark.svg' : '/assets/palette.svg'"/>
                    <input type="color" class="nav__icon" v-model="selectedColor" v-if="store">
                </div>
                <a class="nav__icon" href="https://discord.gg/d5gXN9QYjY" target="_blank">
                    <img :src="!store.dark ? '/assets/discord-dark.svg' : '/assets/discord.svg'" />
                </a>
                <a
                    class="nav__cta type-label-lg"
                    href="https://forms.gle/9GB4amAcMokUTh2b7"
                    target="_blank"
                    >Submit Record</a
                >
            </div>
        </header>
        <main :class="{ dark: store.dark }" v-if="!store.list || !store.loaded">
            <p class="spinner">Loading...</p>
        </main>
        <router-view v-else v-slot="{ Component }">
            <transition name="page" mode="out-in" appear>
                <component :is="Component" :key="$route.path" :class="{ dark: store.dark }" />
            </transition>
        </router-view>
    </body>
</html>
